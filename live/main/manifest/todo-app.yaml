apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: default
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: asia-southeast2-docker.pkg.dev/${PROJECT_ID}/todo-app/todo-app:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: todo-data
              mountPath: /data
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: todo-data
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: todo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
# CronJob to backup the SQLite database every 5 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
  namespace: default
  labels:
    app: todo-backup
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: todo-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: python:3.12-slim
              command: ["python", "-c"]
              args:
                - |
                  import sqlite3, os, time
                  src = "/data/todos.db"
                  dst = "/data/backups/todos-%s.db" % time.strftime("%Y%m%d%H%M%S")
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  conn = sqlite3.connect(src)
                  bck = sqlite3.connect(dst)
                  with bck:
                      conn.backup(bck)
                  conn.close()
                  bck.close()
                  print("backed up to", dst)
              volumeMounts:
                - name: todo-data
                  mountPath: /data
          volumes:
            - name: todo-data
              persistentVolumeClaim:
                claimName: todo-data
